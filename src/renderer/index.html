html,body{margin:0;height:100%;background:transparent}
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#010103;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;color:#ece9fb;-webkit-user-select:none;user-select:none;cursor:default}
#splash *{box-sizing:border-box}
.sp-drag{position:absolute;top:0;left:0;right:0;height:44px;-webkit-app-region:drag;z-index:5}
.sp-stage{position:relative;width:min(300px,38vh);aspect-ratio:1;margin-top:-4vh}
.sp-stage>div{position:absolute;will-change:transform,opacity}
.sp-layer{inset:0}
.sp-layer svg,.sp-orbit svg,.sp-seg svg{display:block;width:100%;height:100%;overflow:visible}
/* the reflector behind the N */
.sp-spot{left:-30%;top:-28%;width:160%;height:160%;border-radius:50%;background:radial-gradient(circle,rgba(250,248,255,1) 0,rgba(226,218,255,.85) 7%,rgba(170,150,255,.42) 20%,rgba(110,80,230,.16) 36%,transparent 60%);opacity:0;animation:sp-light-on 1s cubic-bezier(.25,.6,.3,1) .15s both,sp-light-off .5s linear 1.964s forwards}
.sp-rays{left:-85%;top:-82%;width:270%;height:270%;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(235,230,255,.09) 0deg 3deg,transparent 3deg 11deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 52%);mask:radial-gradient(circle,#000 8%,transparent 52%);opacity:0;animation:sp-light-on 1.3s ease-out .3s both,sp-spin 40s linear infinite,sp-light-off .5s linear 1.964s forwards}
.sp-rim{opacity:0;animation:sp-rim-on 1s ease-out .2s both,sp-rim-off .5s linear 1.964s forwards,sp-rim-out .4s ease-out 3.900s forwards}
.sp-rim svg{filter:blur(7px)}
.sp-dark svg{filter:drop-shadow(0 0 1px rgba(230,226,255,.35))}
.sp-white{opacity:0;animation:sp-white-on .7s cubic-bezier(.2,.7,.2,1) 3.880s both}
.sp-white svg{filter:drop-shadow(0 0 18px rgba(186,160,255,.55))}
.sp-bloom{left:-40%;top:-40%;width:180%;height:180%;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.5) 0,rgba(124,77,255,.2) 30%,transparent 62%);opacity:0;animation:sp-bloom 1.1s linear(0, 0.0235, 0.0822, 0.162, 0.2524, 0.3461, 0.4377, 0.524, 0.6029, 0.6734, 0.735, 0.7881, 0.8331, 0.8706, 0.9016, 0.9266, 0.9467, 0.9625, 0.9748, 0.9842, 0.9912, 0.9962, 0.9998, 1.0022, 1.0037, 1.0046, 1.005, 1.005, 1.0048, 1.0045, 1.004, 1.0036, 1.0031, 1.0026, 1.0022, 1.0018, 1) 3.900s both,sp-breathe 4.8s ease-in-out 5.100s infinite}
/* the orbit: a circle squashed + tilted into the logo's ellipse */
.sp-orbit{left:-7%;top:-7%;width:112%;height:112%;transform:rotate(-22deg) scaleY(0.4432)}
.sp-comet{position:absolute;inset:0;transform:rotate(150deg);animation:sp-orbit 3.0s linear(0.0000, 0.0008, 0.0054, 0.0161, 0.0335, 0.0554, 0.0796, 0.1039, 0.1278, 0.1521, 0.1763, 0.2002, 0.2245, 0.2487, 0.2726, 0.2969, 0.3211, 0.3450, 0.3693, 0.3935, 0.4174, 0.4417, 0.4659, 0.4898, 0.5141, 0.5383, 0.5622, 0.5865, 0.6107, 0.6346, 0.6589, 0.6831, 0.7070, 0.7313, 0.7556, 0.7794, 0.8025, 0.8241, 0.8438, 0.8623, 0.8794, 0.8948, 0.9092, 0.9222, 0.9339, 0.9445, 0.9540, 0.9622, 0.9696, 0.9760, 0.9814, 0.9860, 0.9898, 0.9929, 0.9953, 0.9971, 0.9984, 0.9993, 0.9998, 1.0000, 1.0000) 1.0s both}
.sp-comet svg{filter:drop-shadow(0 0 10px rgba(150,110,255,.95)) drop-shadow(0 0 26px rgba(110,70,240,.7))}
.sp-comet-fade{position:absolute;inset:0;opacity:0;animation:sp-comet-life 3.35s linear 0.95s both}
.sp-comet.front{animation:sp-orbit 3.0s linear(0.0000, 0.0008, 0.0054, 0.0161, 0.0335, 0.0554, 0.0796, 0.1039, 0.1278, 0.1521, 0.1763, 0.2002, 0.2245, 0.2487, 0.2726, 0.2969, 0.3211, 0.3450, 0.3693, 0.3935, 0.4174, 0.4417, 0.4659, 0.4898, 0.5141, 0.5383, 0.5622, 0.5865, 0.6107, 0.6346, 0.6589, 0.6831, 0.7070, 0.7313, 0.7556, 0.7794, 0.8025, 0.8241, 0.8438, 0.8623, 0.8794, 0.8948, 0.9092, 0.9222, 0.9339, 0.9445, 0.9540, 0.9622, 0.9696, 0.9760, 0.9814, 0.9860, 0.9898, 0.9929, 0.9953, 0.9971, 0.9984, 0.9993, 0.9998, 1.0000, 1.0000) 1.0s both,sp-depth-front 3.0s linear 1.0s both}

.sp-seg{position:absolute;inset:0;opacity:0;will-change:opacity;animation:sp-seg .2s ease-out both}
.sp-seg svg{filter:drop-shadow(0 0 9px rgba(124,77,255,.75))}
.sp-flash{left:41.7%;top:30.9%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#fff;box-shadow:0 0 30px 12px rgba(210,190,255,.9),0 0 90px 40px rgba(124,77,255,.55);opacity:0;animation:sp-flash .9s cubic-bezier(.2,.8,.2,1) 3.880s both}
.sp-stage{animation:sp-settle .9s linear(0, 0.0337, 0.118, 0.2318, 0.3586, 0.4863, 0.6065, 0.714, 0.8059, 0.8812, 0.9405, 0.985, 1.0164, 1.037, 1.0488, 1.0538, 1.0538, 1.0504, 1.0449, 1.0382, 1.0312, 1.0245, 1.0183, 1.0129, 1.0083, 1.0047, 1.0019, 0.9999, 0.9985, 0.9976, 0.9972, 0.9971, 0.9972, 0.9974, 0.9977, 0.9981, 1) 3.900s both}
.sp-word{margin-top:34px;display:flex;font-weight:700;font-size:17px;letter-spacing:.32em;padding-left:.32em;text-shadow:0 0 24px rgba(139,92,246,.55)}
.sp-word span{display:inline-block;opacity:0;will-change:transform,opacity;animation:sp-letter .75s linear(0, 0.0235, 0.0822, 0.162, 0.2524, 0.3461, 0.4377, 0.524, 0.6029, 0.6734, 0.735, 0.7881, 0.8331, 0.8706, 0.9016, 0.9266, 0.9467, 0.9625, 0.9748, 0.9842, 0.9912, 0.9962, 0.9998, 1.0022, 1.0037, 1.0046, 1.005, 1.005, 1.0048, 1.0045, 1.004, 1.0036, 1.0031, 1.0026, 1.0022, 1.0018, 1) both}
.sp-word .gap{width:.45em}.sp-word .ai{color:#ad94ff}
.sp-tag{margin-top:10px;font-size:11.5px;letter-spacing:.02em;color:#8c87a8;opacity:0;animation:sp-rise .8s linear(0, 0.0235, 0.0822, 0.162, 0.2524, 0.3461, 0.4377, 0.524, 0.6029, 0.6734, 0.735, 0.7881, 0.8331, 0.8706, 0.9016, 0.9266, 0.9467, 0.9625, 0.9748, 0.9842, 0.9912, 0.9962, 0.9998, 1.0022, 1.0037, 1.0046, 1.005, 1.005, 1.0048, 1.0045, 1.004, 1.0036, 1.0031, 1.0026, 1.0022, 1.0018, 1) 4.650s both}
.sp-status{position:absolute;bottom:44px;left:0;right:0;height:16px;text-align:center;font-size:11px;color:#6d6987}
.sp-status span{position:absolute;inset:0;opacity:0;will-change:transform,opacity;animation:sp-msg 1.2s ease-in-out both}
.sp-status span:last-child{animation:sp-rise .5s ease-out both}
#splash.sp-exit{pointer-events:none;animation:sp-out .7s cubic-bezier(.4,0,.2,1) forwards}
#splash.sp-exit .sp-stage{animation:sp-zoom .7s cubic-bezier(.55,0,.2,1) forwards}
#splash.sp-exit .sp-word,#splash.sp-exit .sp-tag,#splash.sp-exit .sp-status{animation:sp-down .45s ease-in forwards}
@keyframes sp-light-on{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes sp-rim-on{from{opacity:0}to{opacity:.9}}
@keyframes sp-light-off{0%{opacity:1}22%{opacity:.25}36%{opacity:.85}52%{opacity:.12}64%{opacity:.5}100%{opacity:0}}
@keyframes sp-rim-off{0%{opacity:.9}22%{opacity:.25}36%{opacity:.75}52%{opacity:.1}100%{opacity:.16}}
@keyframes sp-rim-out{from{opacity:.16}to{opacity:0}}
@keyframes sp-spin{to{transform:rotate(360deg)}}
@keyframes sp-orbit{from{transform:rotate(150deg)}to{transform:rotate(-450deg)}}
@keyframes sp-comet-life{0%{opacity:0}9%{opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes sp-depth-front{0%{opacity:1}21.62%{opacity:1}21.92%{opacity:0}42.35%{opacity:0}42.65%{opacity:1}63.72%{opacity:1}64.02%{opacity:0}100%{opacity:0}}

@keyframes sp-seg{from{opacity:0}to{opacity:1}}
@keyframes sp-white-on{from{opacity:0}to{opacity:1}}
@keyframes sp-bloom{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes sp-breathe{0%,100%{opacity:1}50%{opacity:.65}}
@keyframes sp-flash{0%{opacity:0;transform:scale(.2)}25%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(2.6)}}
@keyframes sp-settle{0%{transform:scale(.97)}100%{transform:none}}
@keyframes sp-letter{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
@keyframes sp-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sp-msg{0%{opacity:0;transform:translateY(5px)}18%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-5px)}}
@keyframes sp-out{to{opacity:0}}
@keyframes sp-zoom{to{opacity:0;transform:scale(1.3)}}
@keyframes sp-down{to{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){#splash *,#splash{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
